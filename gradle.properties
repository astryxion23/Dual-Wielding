# Gradle
org.gradle.jvmargs=-Xmx3G
org.gradle.daemon=false

# Minecraft / Forge
minecraft_version=1.20.1
minecraft_version_range=[1.20.1,1.21)
forge_version=47.4.10
forge_version_range=[47,)
loader_version_range=[47,)

# Mappings (official = Mojang names; see https://github.com/MinecraftForge/MCPConfig/blob/master/Mojang.md)
mapping_channel=official
mapping_version=1.20.1

# Mod (mod_id must match @Mod and mods.toml)
mod_id=dualwielding
mod_name=Dual Wielding
mod_license=MIT
mod_version=1.20.1-1.0.0
mod_group_id=net.dualwielding
mod_authors=Astryxion
mod_credits=Astryxion
mod_description=Enables dual wielding.

# Built jar name without version (e.g. DualWielding-1.0.0.jar). Defaults to mod_id if omitted.
archive_base_name=DualWieldingForge
