# Sets default memory used for gradle commands. Can be overridden by user or command line properties.
org.gradle.jvmargs=-Xmx1G
org.gradle.daemon=true
org.gradle.parallel=true
org.gradle.caching=true
org.gradle.configuration-cache=true

# Environment Properties — https://projects.neoforged.net/neoforged/neoforge
minecraft_version=26.1
# Accept any future 26.1.x game version until a breaking MC release.
minecraft_version_range=[26.1,)
# Pin the dev NeoForge version; allow any newer 26.1.x NeoForge on players' instances until APIs diverge.
neo_version=26.1.2.10-beta
neo_version_range=[26.1.0-beta,)
# The loader version range can only use the major version of FML as bounds
loader_version_range=[1,)

